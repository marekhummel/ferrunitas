[package]
name = "ferrunitas"
version = "0.1.0"
edition = "2024"
description = "A type-safe unit conversion library with compile-time dimensional analysis"
license = "Apache-2.0"
keywords = ["units", "conversion", "measurement", "SI", "dimensional-analysis"]
categories = ["science", "data-structures", "mathematics", "value-formatting"]
repository = "https://github.com/marekhummel/ferrunitas"

[profile.release]
lto = "fat"

[lints.rust]
missing_docs = "warn"

[lib]
name = "ferrunitas"
path = "src/lib.rs"

[dependencies]
const_format = "0.2.34"
num-traits = "0.2.19"
typenum = "1.18.0"
paste = "1.0"

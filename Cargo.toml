[package]
name = "ferrunitas"
version = "0.1.0"
edition = "2021"
description = "A type-safe unit conversion library with compile-time dimensional analysis"
license = "MIT OR Apache-2.0"
keywords = ["units", "physics", "dimensional-analysis", "type-safety"]
categories = ["science", "mathematics"]

[[bin]]
name = "ferrunitas-test"
path = "examples/test_conf_impls.rs"

[[bin]]
name = "ferrunitas-demo"
path = "examples/main.rs"

[lib]
name = "ferrunitas"
path = "src/lib.rs"

[dependencies]
const_format = "0.2.34"
dimensioned = "0.8.0"
typenum = "1.18.0"

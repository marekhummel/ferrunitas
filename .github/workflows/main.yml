name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check build on multiple toolchains
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [1.85.0, stable, beta, nightly] # We test MSRV + stable + beta + nightly
        features: [
          "--no-default-features", # no_std
          "--no-default-features --features \"serde approx\"", # no_std with external crates
          "--no-default-features --features \"std serde quantity_tags approx\"" # all features
        ]
        real: ["--features f64", "--features f32"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cargo build
        run: cargo build --release ${{ matrix.features }} ${{ matrix.real }} --verbose

      - name: Cargo test
        run: cargo test ${{ matrix.features }} ${{ matrix.real }} --verbose

      - name: Install no_std_check
        run: cargo install cargo-no-std-check
        if: matrix.rust == 'nightly' && matrix.features == '--no-default-features'

      - name: Check no_std compatibility
        run: cargo no-std-check --no-default-features ${{ matrix.real }}
        if: matrix.rust == 'nightly' && matrix.features == '--no-default-features'

  # Lint & format
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --features "quantity_tags serde approx" -- -D warnings

  # Docs
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo doc
        run: cargo doc --features "quantity_tags serde approx" --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out Lcov --workspace --all-features

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true
